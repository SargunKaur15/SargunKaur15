<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Network Packet Analyzer</title>
  <desc id="desc">Animated banner: TCP and UDP packets travel between a host and a server while the analyzer prints each packet's source, destination, protocol and ports.</desc>
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="450" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="220" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .fwd { animation: fwd 4s linear infinite; opacity: 0; }
    .back { animation: back 4s linear infinite; opacity: 0; }
    .p2 { animation-delay: 1.3s; } .p3 { animation-delay: 2.6s; }
    .wire { stroke-dasharray: 5 7; animation: wire 1s linear infinite; }
    .tap { transform-box: fill-box; transform-origin: center; animation: tap 1.3s ease-in-out infinite; }
    .l1 { animation: line1 8s steps(1) infinite; }
    .l2 { animation: line2 8s steps(1) infinite; }
    @keyframes fwd { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(340px); opacity: 0; } }
    @keyframes back { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(-340px); opacity: 0; } }
    @keyframes wire { to { stroke-dashoffset: -12; } }
    @keyframes tap { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.25); opacity: 1; } }
    @keyframes line1 { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes line2 { 0% { opacity: 0; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fwd, .back, .wire, .tap { animation: none; } .fwd, .back { opacity: 1; } .l1 { animation: none; } .l2 { display: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="220" fill="#0b0d12"/>
    <rect width="600" height="220" fill="url(#grid)"/>

    <text x="300" y="40" text-anchor="middle" class="sans" font-size="26" font-weight="800" fill="url(#name)">Network Packet Analyzer</text>
    <text x="300" y="60" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">scapy.sniff() · IP / TCP / UDP field inspection</text>

    <!-- host (laptop) -->
    <g transform="translate(46 82)">
      <rect x="0" y="0" width="72" height="46" rx="6" fill="#161b22" stroke="#22d3ee" stroke-width="2"/>
      <rect x="8" y="8" width="56" height="30" rx="2" fill="#22d3ee" fill-opacity="0.12"/>
      <path d="M-8 52 H80 L74 58 H-2 Z" fill="#30363d"/>
      <text x="36" y="-8" text-anchor="middle" class="mono" font-size="11" fill="#22d3ee">host</text>
    </g>
    <!-- server -->
    <g transform="translate(490 76)">
      <rect x="0" y="0" width="62" height="20" rx="4" fill="#161b22" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="22" width="62" height="20" rx="4" fill="#161b22" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="44" width="62" height="20" rx="4" fill="#161b22" stroke="#10b981" stroke-width="2"/>
      <circle cx="50" cy="10" r="2.5" fill="#10b981"/><circle cx="50" cy="32" r="2.5" fill="#10b981"/><circle cx="50" cy="54" r="2.5" fill="#10b981"/>
      <text x="31" y="-8" text-anchor="middle" class="mono" font-size="11" fill="#10b981">server</text>
    </g>

    <!-- wire + analyzer tap -->
    <path class="wire" d="M130 108 H478" stroke="#8b949e" stroke-opacity="0.5" stroke-width="2" fill="none"/>
    <g>
      <circle class="tap" cx="304" cy="108" r="11" fill="#ff6b35" fill-opacity="0.18" stroke="#ff6b35" stroke-width="2"/>
      <circle cx="304" cy="108" r="4" fill="#ff6b35"/>
      <path d="M304 119 V134" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- packets -->
    <g class="fwd"><rect x="134" y="92" width="38" height="14" rx="4" fill="#22d3ee"/><text x="153" y="103" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#0b0d12">TCP</text></g>
    <g class="back p2"><rect x="436" y="110" width="38" height="14" rx="4" fill="#10b981"/><text x="455" y="121" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#0b0d12">TCP</text></g>
    <g class="fwd p3"><rect x="134" y="92" width="38" height="14" rx="4" fill="#a855f7"/><text x="153" y="103" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#0b0d12">UDP</text></g>

    <!-- readout -->
    <rect x="70" y="140" width="460" height="62" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="84" y="160" class="mono" font-size="10" letter-spacing="1.5" fill="#8b949e">PACKET</text>
    <g class="mono" font-size="12">
      <text class="l1" x="84" y="184"><tspan fill="#22d3ee">192.168.1.10:51544</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#10b981">203.0.113.80:443</tspan><tspan fill="#ff6b35">  TCP</tspan></text>
      <text class="l2" x="84" y="184"><tspan fill="#22d3ee">192.168.1.10:53211</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#10b981">203.0.113.53:53</tspan><tspan fill="#a855f7">   UDP</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="219" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
