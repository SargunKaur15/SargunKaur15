<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="title desc">
  <title id="title">AI-CyberSentinel SOC Dashboard</title>
  <desc id="desc">Animated banner: a scan line moves down a raw alert log and highlights indicators of compromise (an IP, a URL and a file hash), which appear as extracted IOC chips before a HIGH severity verdict and an incident report.</desc>
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="372" y1="0" x2="580" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="600" height="220" rx="16"/></clipPath>
    <clipPath id="log"><rect x="20" y="44" width="334" height="156"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .scan { animation: scan 8s linear infinite; }
    .hl { opacity: 0; animation: hl 8s ease-out infinite; }
    .chip { opacity: 0; animation: chip 8s ease-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.8s; } .d4 { animation-delay: 2.8s; } .d5 { animation-delay: 3.4s; }
    .sev { transform-box: fill-box; transform-origin: center; }
    @keyframes scan { 0% { transform: translateY(0); } 50%, 100% { transform: translateY(150px); } }
    @keyframes hl { 0%, 14% { opacity: 0; } 18% { opacity: 1; } 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes chip { 0%, 16% { opacity: 0; transform: translateX(14px); } 22% { opacity: 1; transform: translateX(0); } 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scan { display: none; } .hl, .chip { animation: none; opacity: 1; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="220" fill="#0b0d12"/>

    <!-- log window -->
    <rect x="12" y="14" width="350" height="194" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="28" cy="29" r="4" fill="#ff5f57"/><circle cx="41" cy="29" r="4" fill="#febc2e"/><circle cx="54" cy="29" r="4" fill="#28c840"/>
    <text x="187" y="33" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">alert.log</text>
    <g clip-path="url(#log)">
      <!-- IOC highlights sit behind the text -->
      <rect class="hl d1" x="167.9" y="75" width="88.8" height="17" rx="3" fill="#ff6b35" fill-opacity="0.3" stroke="#ff6b35"/>
      <rect class="hl d2" x="50.6" y="115" width="206.1" height="17" rx="3" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7"/>
      <rect class="hl d3" x="50.6" y="155" width="226.8" height="17" rx="3" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee"/>
      <g class="mono" font-size="11.5" fill="#c9d1d9">
        <text x="26" y="66" fill="#8b949e">03:12:44 WARN auth.ssh</text>
        <text x="26.0" y="88" textLength="144.9" lengthAdjust="spacingAndGlyphs">failed login x27 src=</text><text x="170.9" y="88" textLength="82.8" lengthAdjust="spacingAndGlyphs">203.0.113.45</text>
        <text x="26" y="108" fill="#8b949e">03:13:02 ALERT proxy</text>
        <text x="26.0" y="128" textLength="27.6" lengthAdjust="spacingAndGlyphs">GET </text><text x="53.6" y="128" textLength="200.1" lengthAdjust="spacingAndGlyphs">http://198.51.100.7/stage.ps1</text>
        <text x="26" y="148" fill="#8b949e">03:13:05 ALERT edr</text>
        <text x="26.0" y="168" textLength="27.6" lengthAdjust="spacingAndGlyphs">md5=</text><text x="53.6" y="168" textLength="220.8" lengthAdjust="spacingAndGlyphs">44d88612fea8a8f36de82e1278abb02f</text>
        <text x="26" y="188" fill="#8b949e">host=WS-0142 user=analyst</text>
      </g>
      <rect class="scan" x="20" y="40" width="334" height="16" fill="url(#scan)"/>
    </g>

    <!-- right column -->
    <text x="374" y="40" class="sans" font-size="21" font-weight="800" fill="url(#name)">AI-CyberSentinel</text>
    <text x="374" y="58" class="mono" font-size="11" fill="#8b949e">LLM-assisted L1 alert triage</text>
    <text x="374" y="82" class="mono" font-size="10" letter-spacing="1.5" fill="#8b949e">EXTRACTED IOCs</text>
    <g class="chip d1"><rect x="374" y="90" width="206" height="20" rx="5" fill="#161b22" stroke="#ff6b35"/><text x="382" y="104" class="mono" font-size="11" fill="#ff6b35">IP  <tspan fill="#e6edf3">203.0.113.45</tspan></text></g>
    <g class="chip d2"><rect x="374" y="114" width="206" height="20" rx="5" fill="#161b22" stroke="#a855f7"/><text x="382" y="128" class="mono" font-size="11" fill="#a855f7">URL <tspan fill="#e6edf3">198.51.100.7/stage.ps1</tspan></text></g>
    <g class="chip d3"><rect x="374" y="138" width="206" height="20" rx="5" fill="#161b22" stroke="#22d3ee"/><text x="382" y="152" class="mono" font-size="11" fill="#22d3ee">MD5 <tspan fill="#e6edf3">44d88612…abb02f</tspan></text></g>
    <g class="chip d4">
      <rect class="sev" x="374" y="168" width="112" height="28" rx="6" fill="#ff6b35"/>
      <text x="430" y="187" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0b0d12">SEVERITY HIGH</text>
    </g>
    <g class="chip d5">
      <rect x="494" y="168" width="86" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
      <text x="537" y="187" text-anchor="middle" class="mono" font-size="11" fill="#10b981">report ✓</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="219" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
