<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ff6b35"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="0.85" stop-color="#10b981"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-200px); } 60%, 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .shine { display: none; } }
  </style>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line)" opacity="0.8"/>
  <rect class="shine" x="0" y="5" width="200" height="2" fill="url(#shine)"/>
  <circle cx="600" cy="6" r="3.5" fill="#0d1117" stroke="#a855f7" stroke-width="1.5"/>
</svg>
