<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Animated illustration of a girl coding</title>
  <desc id="desc">A girl with headphones and orange glasses types on a laptop with a glowing shield logo. Code scrolls on a screen behind her, a security lock card floats nearby and steam rises from a coffee mug.</desc>
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff6b35"/>
      <stop offset="0.7" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="480" height="360" rx="20"/></clipPath>
    <clipPath id="screen"><rect x="42" y="66" width="112" height="118" rx="4"/></clipPath>
  </defs>
  <style>
    * { transform-box: fill-box; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .body { animation: breathe 4s ease-in-out infinite; transform-origin: center bottom; }
    .hair { animation: sway 5s ease-in-out infinite; transform-origin: center top; }
    .eye { animation: blink 5s infinite; transform-origin: center; }
    .handL { animation: tap .5s ease-in-out infinite alternate; }
    .handR { animation: tap .5s ease-in-out .25s infinite alternate; }
    .code { animation: scroll 9s linear infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    .float2 { animation: float 6s ease-in-out 1s infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .steam { animation: steam 3s ease-in-out infinite; opacity: 0; }
    .s2 { animation-delay: 1.5s; }
    .bit { animation: rise 6s linear infinite; opacity: 0; }
    .b2 { animation-delay: 2s; } .b3 { animation-delay: 4s; }
    .scanbar { animation: scanbar 2.5s ease-in-out infinite; transform-origin: left center; }
    .caret { animation: caret 1s steps(1) infinite; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes tap { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes scroll { to { transform: translateY(-140px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-14px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: .8; } 100% { opacity: 0; transform: translateY(-60px); } }
    @keyframes scanbar { 0% { transform: scaleX(0.05); } 70%, 100% { transform: scaleX(1); } }
    @keyframes caret { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .body, .hair, .eye, .handL, .handR, .code, .float, .float2, .pulse, .bit, .scanbar, .caret { animation: none; }
      .steam { animation: none; opacity: .5; } .bit { opacity: .6; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="480" height="360" fill="#0b0d12"/>
    <rect width="480" height="360" fill="url(#grid)"/>
    <ellipse cx="240" cy="190" rx="150" ry="130" fill="url(#halo)"/>

    <!-- code screen behind, left -->
    <g class="float2">
      <rect x="34" y="40" width="128" height="152" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="48" cy="53" r="3" fill="#ff5f57"/><circle cx="58" cy="53" r="3" fill="#febc2e"/><circle cx="68" cy="53" r="3" fill="#28c840"/>
      <g clip-path="url(#screen)">
        <g class="code">
          <!-- two identical 140px blocks so the scroll loops seamlessly -->
          <g id="lines">
            <rect x="46" y="72" width="34" height="5" rx="2.5" fill="#a855f7"/><rect x="84" y="72" width="44" height="5" rx="2.5" fill="#e6edf3" opacity=".6"/>
            <rect x="54" y="86" width="26" height="5" rx="2.5" fill="#22d3ee"/><rect x="84" y="86" width="56" height="5" rx="2.5" fill="#ff6b35"/>
            <rect x="54" y="100" width="70" height="5" rx="2.5" fill="#10b981"/>
            <rect x="62" y="114" width="40" height="5" rx="2.5" fill="#e6edf3" opacity=".6"/><rect x="106" y="114" width="30" height="5" rx="2.5" fill="#a855f7"/>
            <rect x="62" y="128" width="58" height="5" rx="2.5" fill="#22d3ee"/>
            <rect x="54" y="142" width="22" height="5" rx="2.5" fill="#ff6b35"/><rect x="80" y="142" width="48" height="5" rx="2.5" fill="#e6edf3" opacity=".6"/>
            <rect x="46" y="156" width="14" height="5" rx="2.5" fill="#a855f7"/>
            <rect x="46" y="170" width="52" height="5" rx="2.5" fill="#10b981"/><rect x="102" y="170" width="36" height="5" rx="2.5" fill="#e6edf3" opacity=".6"/>
            <rect x="54" y="184" width="64" height="5" rx="2.5" fill="#22d3ee"/>
            <rect x="54" y="198" width="30" height="5" rx="2.5" fill="#ff6b35"/>
          </g>
          <use href="#lines" y="140"/>
        </g>
      </g>
    </g>

    <!-- security card, right -->
    <g class="float">
      <rect x="326" y="46" width="124" height="86" rx="12" fill="#161b22" stroke="#30363d"/>
      <g transform="translate(342 62)">
        <rect x="0" y="12" width="24" height="20" rx="4" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <path d="M5 12 V7 a7 7 0 0 1 14 0 V12" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <circle cx="12" cy="22" r="2.5" fill="#10b981"/>
      </g>
      <text x="376" y="78" class="mono" font-size="11" fill="#e6edf3">THREAT</text>
      <text x="376" y="92" class="mono" font-size="11" fill="#10b981">SCAN OK</text>
      <rect x="342" y="108" width="92" height="6" rx="3" fill="#0d1117"/>
      <rect class="scanbar" x="342" y="108" width="92" height="6" rx="3" fill="#22d3ee"/>
    </g>

    <!-- rising bits -->
    <g class="mono" font-size="12">
      <text x="196" y="96" fill="#22d3ee" class="bit">1</text>
      <text x="288" y="104" fill="#ff6b35" class="bit b2">0</text>
      <text x="312" y="160" fill="#a855f7" class="bit b3">&lt;/&gt;</text>
      <text x="162" y="168" fill="#10b981" class="bit b2">01</text>
    </g>

    <!-- the girl -->
    <g class="body">
      <!-- back hair -->
      <g class="hair">
        <circle cx="240" cy="90" r="17" fill="#5a3424"/>
        <path d="M190 150 C186 98 214 96 240 96 C268 96 294 106 290 150 C292 196 302 232 298 252 L182 252 C178 232 190 198 190 150 Z" fill="#5a3424"/>
      </g>
      <!-- hoodie -->
      <path d="M166 316 C168 272 198 238 240 238 C282 238 312 272 314 316 Z" fill="url(#hoodie)"/>
      <path d="M222 240 L240 262 L258 240" fill="none" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/>
      <!-- side strands -->
      <path d="M200 140 C188 178 186 222 194 262 C204 258 210 214 208 162 Z" fill="#5a3424"/>
      <path d="M280 140 C292 178 294 222 286 262 C276 258 270 214 272 162 Z" fill="#5a3424"/>
      <!-- neck -->
      <rect x="229" y="184" width="22" height="28" rx="8" fill="#e3ad86"/>
      <!-- head -->
      <ellipse cx="240" cy="150" rx="40" ry="44" fill="#f3c6a0"/>
      <!-- fringe -->
      <path d="M198 150 C194 110 220 100 242 101 C266 102 288 116 284 148 C276 130 262 120 246 122 C236 132 216 136 198 150 Z" fill="#5a3424"/>
      <path d="M214 116 C226 106 246 104 262 110" fill="none" stroke="#8a5a3c" stroke-width="3" stroke-linecap="round"/>
      <!-- headphones -->
      <path d="M196 150 C192 92 288 92 284 150" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <rect x="185" y="136" width="15" height="30" rx="7" fill="#22d3ee"/>
      <rect x="280" y="136" width="15" height="30" rx="7" fill="#22d3ee"/>
      <!-- hair clip -->
      <g class="pulse"><circle cx="262" cy="116" r="4" fill="#ff6b35"/><circle cx="256" cy="112" r="3.5" fill="#ff6b35"/><circle cx="268" cy="112" r="3.5" fill="#ff6b35"/><circle cx="262" cy="116" r="2" fill="#ffd166"/></g>
      <!-- face -->
      <circle cx="217" cy="172" r="6" fill="#ff7a90" opacity=".35"/>
      <circle cx="263" cy="172" r="6" fill="#ff7a90" opacity=".35"/>
      <g class="eye"><ellipse cx="226" cy="157" rx="4" ry="5" fill="#1b1325"/><circle cx="227.5" cy="155" r="1.3" fill="#fff"/></g>
      <g class="eye"><ellipse cx="254" cy="157" rx="4" ry="5" fill="#1b1325"/><circle cx="255.5" cy="155" r="1.3" fill="#fff"/></g>
      <g fill="none" stroke="#ff6b35" stroke-width="2">
        <circle cx="226" cy="157" r="11"/><circle cx="254" cy="157" r="11"/><path d="M237 156 Q240 153 243 156"/>
      </g>
      <path d="M234 176 Q240 181 246 176" fill="none" stroke="#b5654a" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- laptop (lid faces the viewer) -->
    <rect x="168" y="236" width="144" height="74" rx="9" fill="#2b3038" stroke="#3d444d"/>
    <circle cx="240" cy="272" r="22" fill="url(#logoGlow)" class="pulse"/>
    <path d="M240 260 L251 264 V272 C251 279 246 284 240 286 C234 284 229 279 229 272 V264 Z" fill="#ff6b35"/>
    <path d="M235 272 l3.5 3.5 l6.5 -7" fill="none" stroke="#0b0d12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- hands -->
    <g class="handL"><rect x="166" y="298" width="24" height="12" rx="6" fill="#6d28d9"/><ellipse cx="186" cy="306" rx="10" ry="7" fill="#f3c6a0"/></g>
    <g class="handR"><rect x="290" y="298" width="24" height="12" rx="6" fill="#6d28d9"/><ellipse cx="294" cy="306" rx="10" ry="7" fill="#f3c6a0"/></g>
    <rect x="158" y="308" width="164" height="8" rx="3" fill="#444c56"/>

    <!-- desk -->
    <rect x="30" y="316" width="420" height="14" rx="4" fill="#1c2128"/>
    <rect x="30" y="316" width="420" height="2" fill="url(#edge)"/>

    <!-- mug -->
    <g>
      <path class="steam" d="M372 278 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
      <path class="steam s2" d="M382 278 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
      <rect x="362" y="284" width="30" height="32" rx="5" fill="#10b981"/>
      <path d="M392 292 h5 a7 7 0 0 1 0 14 h-5" fill="none" stroke="#10b981" stroke-width="4"/>
      <text x="377" y="304" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#0b0d12">&gt;_</text>
    </g>

    <!-- prompt line -->
    <text x="34" y="350" class="mono" font-size="12" fill="#8b949e">~/blue-team $ <tspan fill="#e6edf3">building</tspan></text>
    <rect class="caret" x="200" y="340" width="7" height="13" fill="#ff6b35"/>
  </g>
  <rect x="0.5" y="0.5" width="479" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
