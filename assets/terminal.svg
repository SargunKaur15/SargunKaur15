<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Terminal introduction</title>
  <desc id="desc">whoami: Sargun Kaur, B.Tech CSE at GGSIPU Delhi. Focus: Blue Team, SOC analysis, detection engineering, then machine learning for security. Featured projects: SOCGenie, AI-CyberSentinel-SOC-Dashboard, Network-Packet-Analyzer. Mission: build real-world AI and cybersecurity solutions.</desc>
  <defs>
    <clipPath id="body"><rect x="1" y="44" width="898" height="285" rx="0"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="0.35" stop-color="#a855f7"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    .p { fill: #10b981; } .c { fill: #e6edf3; } .o { fill: #8b949e; } .h { fill: #22d3ee; } .a { fill: #ff6b35; } .v { fill: #a855f7; }
    /* "typing": a background-coloured cover slides right in character-sized steps */
    .t1 { animation: type1 0.6s steps(6) 0.3s both; }
    .t2 { animation: type2 1.0s steps(13) 1.4s both; }
    .t3 { animation: type3 1.6s steps(24) 2.9s both; }
    .t4 { animation: type4 1.0s steps(13) 5.0s both; }
    .out { opacity: 0; animation: show .01s linear forwards; }
    .cursor { fill: #ff6b35; animation: blink 1s steps(1) infinite; }
    @keyframes type1 { from { transform: translateX(0); } to { transform: translateX(54px); } }
    @keyframes type2 { from { transform: translateX(0); } to { transform: translateX(117px); } }
    @keyframes type3 { from { transform: translateX(0); } to { transform: translateX(216px); } }
    @keyframes type4 { from { transform: translateX(0); } to { transform: translateX(117px); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t2, .t3, .t4 { display: none; } .out { animation: none; opacity: 1; } .cursor { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 44 H899" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="3" rx="1.5" fill="url(#bar)" opacity="0.9"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="23" r="6" fill="#febc2e"/>
  <circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" class="o" style="font-size:13px">sargun@blue-team: ~</text>

  <g clip-path="url(#body)">
    <!-- 1 -->
    <text x="24" y="80"><tspan class="p">➜</tspan> <tspan class="h">~</tspan></text><text x="66" y="80" class="c" textLength="54" lengthAdjust="spacingAndGlyphs">whoami</text>
    <rect class="t1" x="66" y="64" width="60" height="22" fill="#0d1117"/>
    <text x="24" y="104" class="out" style="animation-delay:1s"><tspan class="a">Sargun Kaur</tspan><tspan class="o"> · B.Tech CSE @ GGSIPU Delhi</tspan></text>

    <!-- 2 -->
    <text x="24" y="140"><tspan class="p">➜</tspan> <tspan class="h">~</tspan></text><text x="66" y="140" class="c" textLength="117" lengthAdjust="spacingAndGlyphs">cat focus.txt</text>
    <rect class="t2" x="66" y="124" width="123" height="22" fill="#0d1117"/>
    <text x="24" y="164" class="out" style="animation-delay:2.5s"><tspan class="v">Blue Team</tspan><tspan class="o"> · </tspan><tspan class="v">SOC analysis</tspan><tspan class="o"> · </tspan><tspan class="v">detection engineering</tspan><tspan class="o"> · </tspan><tspan class="v">ML for security</tspan></text>

    <!-- 3 -->
    <text x="24" y="200"><tspan class="p">➜</tspan> <tspan class="h">~</tspan></text><text x="66" y="200" class="c" textLength="216" lengthAdjust="spacingAndGlyphs">ls ~/projects --featured</text>
    <rect class="t3" x="66" y="184" width="222" height="22" fill="#0d1117"/>
    <text x="24" y="224" class="out" style="animation-delay:4.6s"><tspan class="h">SOCGenie/</tspan>   <tspan class="h">AI-CyberSentinel-SOC-Dashboard/</tspan>   <tspan class="h">Network-Packet-Analyzer/</tspan></text>

    <!-- 4 -->
    <text x="24" y="260"><tspan class="p">➜</tspan> <tspan class="h">~</tspan></text><text x="66" y="260" class="c" textLength="117" lengthAdjust="spacingAndGlyphs">echo $MISSION</text>
    <rect class="t4" x="66" y="244" width="123" height="22" fill="#0d1117"/>
    <text x="24" y="284" class="out" style="animation-delay:6.1s"><tspan class="e" fill="#10b981">Build real-world AI + cybersecurity solutions that hold up in practice.</tspan></text>

    <!-- prompt -->
    <text x="24" y="314" class="out" style="animation-delay:6.4s"><tspan class="p">➜</tspan> <tspan class="h">~</tspan></text>
    <rect class="cursor out" x="62" y="301" width="9" height="17" style="animation: show .01s linear 6.4s forwards, blink 1s steps(1) 6.4s infinite"/>
  </g>
</svg>
