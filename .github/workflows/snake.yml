name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0,12 * * *" # twice a day (UTC)
  workflow_dispatch:

# Only this workflow's token needs write access, and only to repository contents,
# so it can push the generated SVGs to the `output` branch.
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff6b35
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6b35&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
